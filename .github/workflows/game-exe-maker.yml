name: Game Exe Maker

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "downloads/neon-swarm-windows.zip"
  workflow_dispatch:

concurrency:
  group: game-exe-maker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Windows ZIP
    runs-on: windows-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: >-
          python -m pip install pyinstaller==6.22.3
          "pywebview[pyside6]==6.2.1" PySide6==6.10.3

      - name: Build the executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --collect-all webview
          --collect-all qtpy
          --collect-all PySide6
          --name NeonSwarm
          --add-data "MATADORA (Sped Up).mp3;."
          neon_swarm.py

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "neon-swarm.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "neon-swarm.stderr.log"
          $exe = "dist/NeonSwarm/NeonSwarm.exe"
          $server = Start-Process -FilePath $exe `
            -ArgumentList @("--server", "--no-browser", "--port", "18000") `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($server.HasExited) {
                Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                throw "NeonSwarm.exe exited before the server became ready."
              }
              try {
                $page = Invoke-WebRequest -Uri "http://127.0.0.1:18000/" -TimeoutSec 2
                if ($page.StatusCode -eq 200 -and $page.Content.Contains("Neon Swarm")) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "NeonSwarm.exe did not serve the game page."
            }
            $audio = Invoke-WebRequest -Uri "http://127.0.0.1:18000/MATADORA%20(Sped%20Up).mp3" -TimeoutSec 10
            if ($audio.StatusCode -ne 200 -or $audio.RawContentLength -eq 0) {
              throw "The executable did not serve its bundled audio."
            }
          } finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Smoke-test the desktop GUI
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "neon-swarm-gui.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "neon-swarm-gui.stderr.log"
          $exe = "dist/NeonSwarm/NeonSwarm.exe"
          $app = Start-Process -FilePath $exe `
            -ArgumentList @("--gui-smoke-test", "--port", "18001") `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $loaded = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if (Test-Path $stdout) {
                [string]$log = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
                if ($log.Contains("[gui] Embedded game page loaded.")) {
                  $loaded = $true
                  break
                }
                if ($log.Contains("Embedded game window could not start")) {
                  Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                  throw "The packaged desktop GUI could not start."
                }
              }
              if ($app.HasExited) {
                Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                throw "NeonSwarm.exe exited before the desktop game page loaded."
              }
              Start-Sleep -Seconds 1
            }
            if (-not $loaded) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "The packaged desktop GUI did not load the game page."
            }
          } finally {
            if (-not $app.HasExited) {
              Stop-Process -Id $app.Id -Force
            }
          }

      - name: Package the executable
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "neon-swarm-package"
          $outputZip = "downloads/neon-swarm-windows.zip"
          New-Item -ItemType Directory -Force -Path $package, "downloads" | Out-Null
          Copy-Item "dist/NeonSwarm/*" $package -Recurse -Force
          @"
          Neon Swarm for Windows

          Run NeonSwarm.exe to open the game in its desktop window.
          The app checks the local server during startup, then opens the game in an embedded Qt WebEngine window.
          If the embedded window is unavailable, the app displays a clickable local game link.
          To play from other devices on your Wi-Fi, run NeonSwarm.exe --lan.
          Leaderboard and game save data are stored next to NeonSwarm.exe.
          "@ | Set-Content -Encoding utf8 (Join-Path $package "README.txt")
          Compress-Archive -Path (Join-Path $package "*") `
            -DestinationPath $outputZip -Force

      - name: Commit the ZIP package
        shell: pwsh
        run: |
          git config user.name "Game Exe Maker"
          git config user.email "create-games@github.com"
          git add downloads/neon-swarm-windows.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "The generated ZIP is unchanged."
            exit 0
          }
          git commit -m "Build Windows game package"
          $branch = $env:GITHUB_REF_NAME
          $published = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin $branch
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch the latest $branch before publishing the package."
            }

            git diff --quiet $env:GITHUB_SHA "origin/$branch" -- . ":(exclude)downloads/neon-swarm-windows.zip"
            if ($LASTEXITCODE -eq 1) {
              Write-Host "Source advanced during the build; skipping this stale package."
              exit 0
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Could not compare the build source with the latest $branch commit."
            }

            git rebase --strategy-option=theirs "origin/$branch"
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              throw "Could not rebase the generated package onto the latest $branch commit."
            }

            git push origin "HEAD:$branch --force"
            if ($LASTEXITCODE -eq 0) {
              $published = $true
              break
            }
            Write-Host "Branch changed during publish attempt $attempt; retrying."
          }
          if (-not $published) {
            throw "Could not publish the generated package after 3 attempts."
          }
