name: Game Exe Maker

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "downloads/neon-swarm-windows.zip"
  workflow_dispatch:

concurrency:
  group: game-exe-maker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Windows ZIP
    runs-on: windows-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller pywebview

      - name: Build the executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --collect-all webview
          --collect-all pythonnet
          --collect-all clr_loader
          --hidden-import clr
          --name NeonSwarm
          --add-data "MATADORA (Sped Up).mp3;."
          neon_swarm.py

      - name: Sign the executable when a code-signing certificate is configured
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERT_BASE64)) {
            Write-Host "No code-signing certificate configured; this build will be unsigned."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERT_PASSWORD)) {
            throw "WINDOWS_CODESIGN_CERT_PASSWORD must be configured with the certificate."
          }

          $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtool = Get-ChildItem -Path $sdkBin -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "Windows SDK signtool.exe was not found on this runner."
          }

          $certificate = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT_BASE64)
            )
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com `
              /td SHA256 /f $certificate /p $env:WINDOWS_CODESIGN_CERT_PASSWORD `
              /d "Neon Swarm" "dist/NeonSwarm/NeonSwarm.exe"
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed with exit code $LASTEXITCODE."
            }
            & $signtool.FullName verify /pa /v "dist/NeonSwarm/NeonSwarm.exe"
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signature verification failed with exit code $LASTEXITCODE."
            }
          } finally {
            Remove-Item $certificate -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "neon-swarm.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "neon-swarm.stderr.log"
          $exe = "dist/NeonSwarm/NeonSwarm.exe"
          $server = Start-Process -FilePath $exe `
            -ArgumentList @("--server", "--no-browser", "--port", "18000") `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($server.HasExited) {
                Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                throw "NeonSwarm.exe exited before the server became ready."
              }
              try {
                $page = Invoke-WebRequest -Uri "http://127.0.0.1:18000/" -TimeoutSec 2
                if ($page.StatusCode -eq 200 -and $page.Content.Contains("Neon Swarm")) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "NeonSwarm.exe did not serve the game page."
            }
            $audio = Invoke-WebRequest -Uri "http://127.0.0.1:18000/MATADORA%20(Sped%20Up).mp3" -TimeoutSec 10
            if ($audio.StatusCode -ne 200 -or $audio.RawContentLength -eq 0) {
              throw "The executable did not serve its bundled audio."
            }
          } finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Package the executable
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "neon-swarm-package"
          New-Item -ItemType Directory -Force -Path $package, "downloads" | Out-Null
          Copy-Item "dist/NeonSwarm/*" $package -Recurse -Force
          @"
          Neon Swarm for Windows

          Run NeonSwarm.exe to open the game in its desktop window.
          The app shows a 10-second loading screen and writes startup and server logs to its console.
          The app uses the available Windows renderer. Install Microsoft Edge WebView2 Runtime for best compatibility.
          If the embedded window is unavailable, the app displays a clickable local game link.
          To play from other devices on your Wi-Fi, run NeonSwarm.exe --lan.
          Leaderboard and game save data are stored next to NeonSwarm.exe.
          "@ | Set-Content -Encoding utf8 (Join-Path $package "README.txt")
          Compress-Archive -Path (Join-Path $package "*") `
            -DestinationPath "downloads/neon-swarm-windows.zip" -Force

      - name: Commit the ZIP package
        shell: pwsh
        run: |
          git config user.name "Game Exe Maker"
          git config user.email "create-games@github.com"
          git add downloads/neon-swarm-windows.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "The generated ZIP is unchanged."
            exit 0
          }
          git commit -m "Build Windows game package"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
