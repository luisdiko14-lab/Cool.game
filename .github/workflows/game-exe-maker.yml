name: Game Exe Maker

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "Build_and_use_game.exe"
  workflow_dispatch:

concurrency:
  group: game-exe-maker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and upload Windows executable
    runs-on: windows-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: >-
          python -m pip install pyinstaller==6.22.3
          "pywebview[pyside6]==6.2.1" PySide6==6.10.3

      - name: Build the executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --collect-all webview
          --collect-all qtpy
          --collect-all PySide6
          --name NeonSwarm
          --add-data "MATADORA (Sped Up).mp3;."
          neon_swarm.py

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "neon-swarm.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "neon-swarm.stderr.log"
          $exe = "dist/NeonSwarm.exe"
          $server = Start-Process -FilePath $exe `
            -ArgumentList @("--server", "--no-browser", "--port", "18000") `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($server.HasExited) {
                Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                throw "NeonSwarm.exe exited before the server became ready."
              }
              try {
                $page = Invoke-WebRequest -Uri "http://127.0.0.1:18000/" -TimeoutSec 2
                if ($page.StatusCode -eq 200 -and $page.Content.Contains("Neon Swarm")) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "NeonSwarm.exe did not serve the game page."
            }
            $audio = Invoke-WebRequest -Uri "http://127.0.0.1:18000/MATADORA%20(Sped%20Up).mp3" -TimeoutSec 10
            if ($audio.StatusCode -ne 200 -or $audio.RawContentLength -eq 0) {
              throw "The executable did not serve its bundled audio."
            }
          } finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Smoke-test the desktop GUI
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "neon-swarm-gui.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "neon-swarm-gui.stderr.log"
          $exe = "dist/NeonSwarm.exe"
          $app = Start-Process -FilePath $exe `
            -ArgumentList @("--gui-smoke-test", "--port", "18001") `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $loaded = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if (Test-Path $stdout) {
                [string]$log = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
                if ($log.Contains("[gui] Embedded game page loaded.")) {
                  $loaded = $true
                  break
                }
                if ($log.Contains("Embedded game window could not start")) {
                  Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                  throw "The packaged desktop GUI could not start."
                }
              }
              if ($app.HasExited) {
                Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                throw "NeonSwarm.exe exited before the desktop game page loaded."
              }
              Start-Sleep -Seconds 1
            }
            if (-not $loaded) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "The packaged desktop GUI did not load the game page."
            }
          } finally {
            if (-not $app.HasExited) {
              Stop-Process -Id $app.Id -Force
            }
          }

      - name: Build the repository bootstrap
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Build_and_use_game
          --distpath dist/bootstrap
          --workpath build/bootstrap
          --specpath build/bootstrap
          scripts/build_and_use_game.py

      - name: Publish the repository bootstrap
        shell: pwsh
        run: |
          $exe = "dist/bootstrap/Build_and_use_game.exe"
          $size = (Get-Item $exe).Length
          if ($size -ge 100MB) {
            throw "Build_and_use_game.exe exceeds GitHub's 100 MB file limit."
          }
          Copy-Item $exe "Build_and_use_game.exe" -Force
          git config user.name "Game Exe Maker"
          git config user.email "create-games@github.com"
          git add -- Build_and_use_game.exe
          git diff --cached --quiet -- Build_and_use_game.exe
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Build_and_use_game.exe is unchanged."
            exit 0
          }
          git commit -m "Build Build_and_use_game.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not commit Build_and_use_game.exe."
          }

          $branch = $env:GITHUB_REF_NAME
          $published = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin $branch
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch the latest $branch before publishing the bootstrap."
            }
            git diff --quiet $env:GITHUB_SHA "origin/$branch" -- . ":(exclude)Build_and_use_game.exe"
            if ($LASTEXITCODE -eq 1) {
              Write-Host "Source advanced during the build; skipping this stale bootstrap."
              exit 0
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Could not compare the build source with the latest $branch commit."
            }
            git rebase --strategy-option=theirs "origin/$branch"
            if ($LASTEXITCODE -ne 0) {
              $conflicts = @(git diff --name-only --diff-filter=U)
              if ($conflicts.Count -ne 1 -or $conflicts[0] -ne "Build_and_use_game.exe") {
                git rebase --abort
                throw "Could not rebase the bootstrap onto the latest $branch commit."
              }

              Write-Host "Resolving the generated bootstrap conflict with the newly built EXE."
              git checkout --theirs -- Build_and_use_game.exe
              if ($LASTEXITCODE -ne 0) {
                git rebase --abort
                throw "Could not restore the newly built bootstrap after the rebase conflict."
              }
              git add -- Build_and_use_game.exe
              git -c core.editor=true rebase --continue
              if ($LASTEXITCODE -ne 0) {
                git rebase --abort
                throw "Could not finish rebasing the newly built bootstrap."
              }
            }
            git push origin "HEAD:$branch"
            if ($LASTEXITCODE -eq 0) {
              $published = $true
              break
            }
            Write-Host "Branch changed during publish attempt $attempt; retrying."
          }
          if (-not $published) {
            throw "Could not publish Build_and_use_game.exe after 3 attempts."
          }

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: NeonSwarm-Windows.zip
          path: dist/NeonSwarm.exe
          if-no-files-found: error
          retention-days: 90
