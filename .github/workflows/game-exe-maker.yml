name: Neon Swarm Windows Desktop Builder

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "EXE_APP/dist/**"
      - "Build_and_use_game.exe"
  workflow_dispatch:

concurrency:
  group: neon-swarm-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build .NET 10 desktop app, crash recovery and installers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify SDK
        working-directory: EXE_APP
        run: |
          dotnet --info
          if (-not (Test-Path global.json)) { throw "EXE_APP/global.json is missing." }

      - name: Publish Neon_Swarm.exe
        working-directory: EXE_APP
        run: |
          dotnet publish NeonSwarm/NeonSwarm.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=true -o dist/Neon_Swarm
          if ($LASTEXITCODE -ne 0) { throw "Game publish failed." }

      - name: Publish crash recovery helper
        working-directory: EXE_APP
        run: |
          dotnet publish CrashHandler/CrashHandler.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=true -o dist/Neon_Swarm
          if ($LASTEXITCODE -ne 0) { throw "Crash helper publish failed." }

      - name: Smoke-test local game host and files
        run: |
          $p = "EXE_APP/dist/Neon_Swarm"
          $required = @("$p/Neon_Swarm.exe","$p/Neon_Swarm_Crash_Handler.exe","$p/Neon_Swarm.dll","$p/Game/index.html","$p/Game/neon_swarm_features.js","$p/Game/neon_swarm_expansion.js","$p/Game/neon_swarm_apex.js","$p/Game/Raya(Slowed).mp3")
          foreach ($f in $required) { if (-not (Test-Path $f)) { throw "Missing build output: $f" } }
          $smoke = Start-Process -FilePath "$p/Neon_Swarm.exe" -ArgumentList @("--server-smoke-test") -WorkingDirectory (Resolve-Path $p).Path -Wait -PassThru -WindowStyle Hidden
          if ($smoke.ExitCode -ne 0) {
            $diagnostic = Join-Path $env:TEMP "NeonSwarm-SmokeTest.log"
            if (Test-Path $diagnostic) {
              Write-Host "Desktop host smoke-test exception:"
              Get-Content $diagnostic -Raw
            }
            $crashLog = Join-Path $env:LOCALAPPDATA "NeonSwarm/Neon_Swarm_Crash.log"
            if (Test-Path $crashLog) {
              Write-Host "Desktop host crash log:"
              Get-Content $crashLog -Tail 80
            }
            throw "Desktop local-server test failed with exit code $($smoke.ExitCode)."
          }
          $helperTest = Start-Process -FilePath "$p/Neon_Swarm_Crash_Handler.exe" -ArgumentList @("--smoke-test") -WorkingDirectory (Resolve-Path $p).Path -Wait -PassThru -WindowStyle Hidden
          if ($helperTest.ExitCode -ne 0) { throw "Crash-handler smoke test failed with exit code $($helperTest.ExitCode)." }

      - name: Install WiX Toolset 6
        working-directory: EXE_APP
        run: |
          dotnet tool install --global wix --version 6.0.0
          if ($LASTEXITCODE -ne 0) { throw "WiX install failed." }
          $env:PATH = "$env:PATH;$([Environment]::GetFolderPath('UserProfile'))\.dotnet\tools"
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          wix extension add -g WixToolset.UI.wixext
          if ($LASTEXITCODE -ne 0) { throw "WiX UI extension install failed." }
          wix extension add -g WixToolset.BootstrapperApplications.wixext
          if ($LASTEXITCODE -ne 0) { throw "WiX bootstrapper extension install failed." }

      - name: Download WebView2 Evergreen bootstrapper
        working-directory: EXE_APP
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile dist/MicrosoftEdgeWebView2Setup.exe
          if ((Get-Item dist/MicrosoftEdgeWebView2Setup.exe).Length -lt 100KB) { throw "WebView2 bootstrapper download is incomplete." }

      - name: Build MSI with standard install wizard
        working-directory: EXE_APP
        run: |
          $publish = (Resolve-Path dist/Neon_Swarm).Path
          wix build -arch x64 -ext WixToolset.UI.wixext -d "PublishDir=$publish" Installer/Msi/Package.wxs -out dist/Neon_Swarm_Setup.msi
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed." }

      - name: Build Setup.exe wizard
        working-directory: EXE_APP
        run: |
          $dist = (Resolve-Path dist).Path
          wix build -arch x64 -ext WixToolset.BootstrapperApplications.wixext -d "MsiPath=$dist/Neon_Swarm_Setup.msi" -d "WebView2Installer=$dist/MicrosoftEdgeWebView2Setup.exe" Installer/Bundle/Bundle.wxs -out dist/Neon_Swarm_Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "Setup.exe build failed." }

      - name: Create complete portable package
        working-directory: EXE_APP
        run: |
          Compress-Archive -Path dist/Neon_Swarm/* -DestinationPath dist/Neon_Swarm_Portable.zip -CompressionLevel Optimal -Force

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Swarm-Windows-${{ github.run_number }}
          path: |
            EXE_APP/dist/Neon_Swarm/**
            EXE_APP/dist/Neon_Swarm_Setup.exe
            EXE_APP/dist/Neon_Swarm_Setup.msi
            EXE_APP/dist/Neon_Swarm_Portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish release assets
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "neon-swarm-desktop-build-$env:GITHUB_RUN_NUMBER"
          gh release create $tag EXE_APP/dist/Neon_Swarm_Setup.exe EXE_APP/dist/Neon_Swarm_Setup.msi EXE_APP/dist/Neon_Swarm_Portable.zip --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Neon Swarm Desktop Build #$env:GITHUB_RUN_NUMBER" --notes "Windows desktop edition. Setup.exe includes WebView2 prerequisite; MSI is the standard Windows Installer package; Portable ZIP contains EXE, DLLs, game files and crash helper."
          if ($LASTEXITCODE -ne 0) { throw "Could not publish desktop release." }
