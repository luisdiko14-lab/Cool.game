name: Neon Swarm

# ONE FILE. Nothing else is needed in the repo except neon_swarm.py.
# The helper scripts (supervisor, tunnel, waking page) are written out by the
# "Write helper scripts" step below, so there are no files that can go missing.
#
#   * One workflow run chains many "legs" (matrix jobs, max-parallel 1) back to back.
#   * A leg plays for SWARM_MINUTES (GitHub caps a job at 6 h), then the next leg starts.
#   * Inside a leg: crashes, hangs and memory blow-ups restart the game, and pushes hot-reload it.
#   * GitHub ends every run after 35 days, so the last leg hands off to one fresh run.
#
# PUBLIC LINK (never localhost):
#   1. trycloudflare.com  - default, free, no account (a random link that changes each leg)
#   2. localhost.run      - automatic backup if cloudflared cannot connect
#   3. ngrok              - optional; add secret NGROK_AUTHTOKEN and variable NGROK_DOMAIN
#                           for a FIXED link that stays the same every leg and restart
# The link is shown in the run's Summary, as an annotation, and in the log. The game's own
# "localhost" line in the log is rewritten to show the public link instead.
# Phone alerts: add secret NTFY_TOPIC and subscribe to it in the ntfy app.

on:
  workflow_dispatch:
    inputs:
      reset_leaderboard:
        description: "Wipe the saved leaderboard before leg 1"
        type: boolean
        default: false
      legs:
        description: "Legs to chain (about 5.7 h each; 130 is about 31 days)"
        type: number
        default: 130
  # Sent by the last leg to start the next chain at GitHub's 35-day run limit.
  repository_dispatch:
    types: [neon-swarm-handoff]

concurrency:
  group: neon-swarm
  # "Run workflow" restarts the live chain now. Hand-offs queue behind it instead.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PORT: "8000"
  SWARM_MINUTES: "335"     # length of one leg (the job cap is 360)
  MAX_RSS_MB: "6144"       # restart the game above this much memory
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  BROWSER: /bin/true
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  MPLBACKEND: Agg

jobs:
  # ---------------------------------------------------------------- preflight
  plan:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate the project and build the leg matrix
        id: plan
        env:
          LEGS_INPUT: ${{ github.event.inputs.legs || '130' }}
        run: |
          set -euo pipefail
          test -f neon_swarm.py || { echo "::error::neon_swarm.py is missing from the repo root"; exit 1; }
          python -m py_compile neon_swarm.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          legs = int(float(os.environ["LEGS_INPUT"]))
          if not 1 <= legs <= 256:
              raise SystemExit("legs must be between 1 and 256")
          print(f"legs={legs}")
          print("matrix=" + json.dumps({"leg": list(range(1, legs + 1))}))
          PY
          {
            echo "## Preflight passed"
            echo "- Legs chained in this run: ${LEGS_INPUT}"
            echo "- Tracked files: $(git ls-files | wc -l)"
            echo "- Latest commit: $(git log -1 --format='%h %s')"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------- quality (advisory only)
  quality:
    name: Lint, tests and audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools and requirements
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest pip-audit
          if [ -f requirements.txt ]; then python -m pip install --prefer-binary -r requirements.txt; fi

      - name: Ruff - fatal errors only (syntax errors, undefined names)
        continue-on-error: true
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Tests (skipped when there are none)
        continue-on-error: true
        run: |
          if find . -path ./.git -prune -o \( -name 'test_*.py' -o -name '*_test.py' \) -print | grep -q .; then
            python -m pytest -q
          else
            echo "No tests found"
          fi

      - name: Dependency audit
        continue-on-error: true
        run: |
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; else echo "No requirements.txt"; fi

  # ---------------------------------------------- the swarm: a chain of legs
  swarm:
    name: "Leg ${{ matrix.leg }} of ${{ needs.plan.outputs.legs }}"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 358
    permissions:
      contents: write        # hot-reload fetches; the hand-off sends repository_dispatch
    strategy:
      fail-fast: false
      max-parallel: 1        # one leg at a time, all inside this one workflow run
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Start the leg clock
        env:
          LEG: ${{ matrix.leg }}
          LEGS_TOTAL: ${{ needs.plan.outputs.legs }}
        run: |
          {
            echo "LEG_START=$(date +%s)"
            echo "SWARM_DEADLINE=$(( $(date +%s) + SWARM_MINUTES * 60 ))"
            echo "LEG_STARTED=$(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_ENV"
          echo "Leg ${LEG} of ${LEGS_TOTAL} - plays for ${SWARM_MINUTES} minutes"

      - name: Check out the latest code (every file, LFS, submodules, history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Restore leaderboard and state from the previous leg
        if: ${{ github.event.inputs.reset_leaderboard != 'true' || matrix.leg != 1 }}
        uses: actions/cache/restore@v4
        with:
          path: |
            neon_swarm_scores.json
            .neon-state
          key: neon-swarm-state-${{ github.run_id }}-leg-${{ matrix.leg }}
          restore-keys: |
            neon-swarm-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Set up Node.js (only if package.json exists)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git curl wget jq rsync \
            xvfb xauth dbus-x11 ffmpeg \
            libffi-dev libssl-dev libxml2-dev libxslt1-dev zlib1g-dev \
            libjpeg-dev libpng-dev libfreetype6-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 \
            libpq-dev libsqlite3-dev libbz2-dev libreadline-dev
          # Optional extras: a missing one must not break the whole leg
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev portaudio19-dev libwebp-dev libxkbcommon0 fonts-dejavu-core \
            || echo "::warning::some optional system packages were not available"

      - name: Install Python packages (retries on flaky downloads)
        run: |
          retry() {
            for try in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt ${try} failed - retrying"
              sleep 20
            done
            return 1
          }
          retry python -m pip install --upgrade pip setuptools wheel
          retry python -m pip install --prefer-binary \
            flask flask-cors flask-socketio flask-sqlalchemy flask-limiter flask-login flask-compress \
            gunicorn gevent eventlet websockets simple-websocket \
            requests httpx aiohttp python-dotenv pyyaml jinja2 \
            numpy scipy pandas numba networkx matplotlib pillow \
            opencv-python-headless pygame noise \
            rich colorama tqdm psutil click
          if [ -f requirements.txt ]; then
            retry python -m pip install --prefer-binary -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            python -m pip install --prefer-binary . || echo "::warning::pyproject.toml did not install as a package"
          fi
          if [ -f requirements.txt ] && grep -qi '^playwright' requirements.txt; then
            python -m playwright install --with-deps chromium
          fi
          python -m pip list

      - name: npm install (only if package.json exists)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build (only if a Makefile exists)
        run: |
          if [ -f Makefile ]; then make -j"$(nproc)"; else echo "No Makefile - nothing to build"; fi

      - name: Check the game imports before the leg starts
        run: |
          python -m py_compile neon_swarm.py
          python - <<'PY'
          import importlib
          for mod in ["flask", "numpy", "pygame", "psutil"]:
              try:
                  importlib.import_module(mod)
                  print(f"ok       {mod}")
              except Exception as exc:
                  print(f"MISSING  {mod}: {exc}")
          PY

      # ------------------------------------------------------------------
      # All helper scripts live right here, so no other repo files are needed.
      # ------------------------------------------------------------------
      - name: Write helper scripts (supervisor, tunnel, waking page)
        run: |
          set -e
          STATE="$RUNNER_TEMP/neon"
          BIN="$STATE/bin"
          mkdir -p "$BIN" "$STATE/wake"

          # ---------------- waking page (shown while the game is still starting) ----------------
          cat > "$STATE/wake/index.html" <<'WAKE_EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="8">
            <title>Neon Swarm</title>
            <style>
              body { margin: 0; min-height: 100vh; display: grid; place-items: center;
                     background: #07070d; color: #6ff; font-family: system-ui, sans-serif;
                     text-align: center; }
            </style>
          </head>
          <body>
            <div>
              <h1>Neon Swarm is waking up</h1>
              <p>The game server is starting. This page refreshes itself.</p>
            </div>
          </body>
          </html>
          WAKE_EOF

          # ---------------- tunnel keeper ----------------
          cat > "$BIN/tunnel.sh" <<'TUNNEL_EOF'
          #!/usr/bin/env bash
          # Keeps a public (non-localhost) link alive for the whole leg.
          # Providers are tried in order, and the first one that gives a link wins:
          #   ngrok (only if NGROK_AUTHTOKEN is set) -> cloudflared (trycloudflare.com) -> localhost.run
          # The current URL is published to <state>/public_url, its provider to <state>/public_provider.
          # If the link dies, or the client exits, everything restarts from the first provider.
          # Usage: tunnel.sh <state_dir> <port>
          STATE="$1"
          PORT="$2"
          LOG="$STATE/tunnel.log"
          URL_FILE="$STATE/public_url"
          : > "$LOG"

          log() { echo "[tunnel] $(date -u +%T) $*" >> "$LOG"; }

          providers() {
            if [ -n "${NGROK_AUTHTOKEN:-}" ]; then
              echo "ngrok cloudflared localhostrun"
            else
              echo "cloudflared localhostrun"
            fi
          }

          # Starts one tunnel client in the background; sets CLIENT (pid) and writes to CLIENT_LOG.
          start_client() {
            case "$1" in
              ngrok)
                if [ -n "${NGROK_DOMAIN:-}" ]; then
                  ngrok http "$PORT" --url "$NGROK_DOMAIN" --log=stdout > "$CLIENT_LOG" 2>&1 &
                else
                  ngrok http "$PORT" --log=stdout > "$CLIENT_LOG" 2>&1 &
                fi
                ;;
              cloudflared)
                cloudflared tunnel --no-autoupdate --protocol http2 \
                  --url "http://127.0.0.1:${PORT}" > "$CLIENT_LOG" 2>&1 &
                ;;
              localhostrun)
                ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes -o BatchMode=yes \
                  -R "80:127.0.0.1:${PORT}" nokey@localhost.run > "$CLIENT_LOG" 2>&1 &
                ;;
            esac
            CLIENT=$!
          }

          # Prints the public https URL of the given provider, or nothing yet.
          find_url() {
            case "$1" in
              ngrok)
                curl -s -m 3 http://127.0.0.1:4040/api/tunnels \
                  | jq -r '.tunnels[]?.public_url // empty' | grep '^https://' | head -1
                ;;
              cloudflared)
                grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$CLIENT_LOG" | grep -v '//api\.' | tail -1
                ;;
              localhostrun)
                grep -oE 'https://[a-z0-9-]+\.lhr\.life' "$CLIENT_LOG" | tail -1
                ;;
            esac
          }

          # Remembers the last link and pushes it to your phone when it changed.
          notify() {
            local url="$1" prev=""
            local memo="${GITHUB_WORKSPACE:-.}/.neon-state/last_url"
            mkdir -p "$(dirname "$memo")"
            prev="$(cat "$memo" 2>/dev/null || true)"
            echo "$url" > "$memo"
            if [ -n "${NTFY_TOPIC:-}" ] && [ "$prev" != "$url" ]; then
              curl -fsS -m 10 -H "Title: Neon Swarm is live" -H "Click: $url" \
                -d "Play here: $url" "https://ntfy.sh/${NTFY_TOPIC}" > /dev/null 2>&1 || true
            fi
          }

          while true; do
            for p in $(providers); do
              CLIENT_LOG="$STATE/client-$p.log"
              : > "$CLIENT_LOG"
              log "starting $p"
              start_client "$p"

              url=""
              for _ in $(seq 1 45); do
                kill -0 "$CLIENT" 2>/dev/null || break
                url="$(find_url "$p")"
                [ -n "$url" ] && break
                sleep 2
              done

              if [ -z "$url" ]; then
                log "$p gave no link - trying the next provider"
                tail -n 5 "$CLIENT_LOG" >> "$LOG" 2>/dev/null
                kill "$CLIENT" 2>/dev/null
                sleep 1
                continue
              fi

              echo "$url" > "$URL_FILE"
              echo "$p" > "$STATE/public_provider"
              log "$p link ready: $url"
              notify "$url"

              # Stay with this provider while its client lives and the link answers.
              bad=0
              tick=0
              while kill -0 "$CLIENT" 2>/dev/null; do
                sleep 10
                tick=$((tick + 1))
                if [ $((tick % 6)) -eq 0 ]; then
                  code="$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$url" 2>/dev/null)"
                  if [ "$code" = "000" ] || [ "$code" = "530" ]; then bad=$((bad + 1)); else bad=0; fi
                  if [ "$bad" -ge 3 ]; then
                    log "$p link stopped answering - restarting the tunnel"
                    break
                  fi
                fi
              done
              kill "$CLIENT" 2>/dev/null
              wait "$CLIENT" 2>/dev/null
              rm -f "$URL_FILE"
              log "$p ended - starting over"
              break
            done
            sleep 5
          done
          TUNNEL_EOF

          # ---------------- game supervisor ----------------
          cat > "$BIN/supervise.sh" <<'SUPERVISE_EOF'
          #!/usr/bin/env bash
          # Runs neon_swarm.py for one leg of the chain.
          #   * restarts the game after crashes (with backoff), hangs and memory blow-ups
          #   * hot-reloads when new commits land on the branch (same run, same link)
          #   * stops cleanly (Ctrl+C first, so the game can save) when the leg's deadline arrives
          # Expects: PORT, SWARM_DEADLINE (epoch seconds), MAX_RSS_MB, LEG, LEGS_TOTAL

          STATE="${RUNNER_TEMP:-/tmp}/neon"
          mkdir -p "$STATE"
          GAME_LOG="$STATE/game.log"
          EVENTS="$STATE/events.log"
          PIDF="$STATE/game.pid"
          RESTART="$STATE/restart.flag"
          STOP="$STATE/stop.flag"
          BRANCH="${GITHUB_REF_NAME:-main}"
          : > "$GAME_LOG"
          : > "$EVENTS"
          rm -f "$RESTART" "$STOP"

          ev() { echo "$(date -u +%T)  $*" | tee -a "$EVENTS"; }

          game_pid() { cat "$PIDF" 2>/dev/null; }

          alive() {
            local pid
            pid="$(game_pid)"
            [ -n "$pid" ] && { kill -0 -- "-$pid" 2>/dev/null || kill -0 "$pid" 2>/dev/null; }
          }

          send() {
            local pid
            pid="$(game_pid)"
            [ -n "$pid" ] || return 0
            kill -"$1" -- "-$pid" 2>/dev/null || kill -"$1" "$pid" 2>/dev/null
            return 0
          }

          # Ctrl+C first (lets the game save its leaderboard), then escalate.
          stop_game() {
            alive || return 0
            send INT
            for _ in $(seq 1 15); do alive || return 0; sleep 1; done
            send TERM
            for _ in $(seq 1 5); do alive || return 0; sleep 1; done
            send KILL
            return 0
          }

          start_game() {
            rm -f "$RESTART"
            if [ -s "$STATE/wake.pid" ]; then        # free the port from the waking page
              kill "$(cat "$STATE/wake.pid")" 2>/dev/null
              rm -f "$STATE/wake.pid"
              sleep 1
            fi
            # Tiny launcher: restores Ctrl+C handling, gives the game its own process group, then execs it.
            python -c 'import os, signal; signal.signal(signal.SIGINT, signal.SIG_DFL); os.setsid(); os.execvp("python", ["python", "-u", "neon_swarm.py"])' >> "$GAME_LOG" 2>&1 &
            GAME_PID=$!
            echo "$GAME_PID" > "$PIDF"
          }

          # Answers with an HTTP status code, or 000 when nothing listens (tries IPv4, then IPv6).
          probe() {
            local code
            code="$(curl -s -o /dev/null -m 5 -w '%{http_code}' "http://127.0.0.1:${PORT}/" 2>/dev/null)"
            if [ -z "$code" ] || [ "$code" = "000" ]; then
              code="$(curl -s -g -o /dev/null -m 5 -w '%{http_code}' "http://[::1]:${PORT}/" 2>/dev/null)"
            fi
            echo "${code:-000}"
          }

          # ---------------- watchers ----------------

          # Every minute: fetch the branch. New commits fast-forward in and the game reloads.
          watch_repo() {
            while sleep 60; do
              git fetch --quiet origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null || continue
              local_sha="$(git rev-parse HEAD)"
              remote_sha="$(git rev-parse "refs/remotes/origin/${BRANCH}")"
              [ "$local_sha" = "$remote_sha" ] && continue
              changed="$(git diff --name-only "$local_sha" "$remote_sha")"
              if ! git merge --ff-only --quiet "refs/remotes/origin/${BRANCH}" 2>/dev/null; then
                ev "[hot-reload] cannot fast-forward to ${remote_sha:0:7} (local changes?) - skipped"
                continue
              fi
              git submodule update --init --recursive --quiet 2>/dev/null
              if echo "$changed" | grep -q '^requirements.*\.txt$' && [ -f requirements.txt ]; then
                ev "[hot-reload] requirements changed - installing them"
                python -m pip install --prefer-binary -r requirements.txt >> "$STATE/pip-hot.log" 2>&1 \
                  || ev "[hot-reload] pip install failed - see pip-hot.log"
              fi
              if echo "$changed" | grep -qvE '\.md$|^\.github/|^LICENSE'; then
                ev "[hot-reload] new commit ${remote_sha:0:7} on ${BRANCH} - reloading the game"
                touch "$RESTART"
                stop_game
              else
                ev "[hot-reload] docs-only commit ${remote_sha:0:7} - no restart needed"
              fi
            done
          }

          # Every 30 s: if the game stops answering for 3 minutes, it is hung, so restart it.
          watch_health() {
            local fails=0 code
            while sleep 30; do
              if ! alive; then fails=0; continue; fi
              code="$(probe)"
              if [ "$code" = "000" ]; then
                fails=$((fails + 1))
                if [ "$fails" -ge 6 ]; then
                  ev "[health] no answer on port ${PORT} for 3 minutes - restarting the game"
                  touch "$RESTART"
                  stop_game
                  fails=0
                fi
              else
                fails=0
              fi
            done
          }

          # Every minute: restart the game if its memory use passes MAX_RSS_MB.
          watch_memory() {
            local rss_kb rss_mb
            while sleep 60; do
              alive || continue
              rss_kb="$(ps -o rss= -p "$(game_pid)" 2>/dev/null | tr -d ' ')"
              [ -n "$rss_kb" ] || continue
              rss_mb=$((rss_kb / 1024))
              if [ "$rss_mb" -gt "${MAX_RSS_MB:-6144}" ]; then
                ev "[memory] game uses ${rss_mb} MB (limit ${MAX_RSS_MB} MB) - restarting it"
                touch "$RESTART"
                stop_game
              fi
            done
          }

          # Every 5 minutes: one status line for the log.
          heartbeat() {
            while sleep 300; do
              local state="down"
              alive && state="running"
              ev "[heartbeat] leg ${LEG}/${LEGS_TOTAL} | game ${state} | link $(cat "$STATE/public_url" 2>/dev/null || echo none) | load $(cut -d' ' -f1 /proc/loadavg) | free RAM $(free -m | awk '/Mem:/{print $7}') MB"
            done
          }

          # Sleep until the leg deadline, then stop cleanly.
          deadline_timer() {
            local left=$(( SWARM_DEADLINE - $(date +%s) ))
            [ "$left" -gt 0 ] && sleep "$left"
            ev "[deadline] this leg's time is up - stopping cleanly so the next leg takes over"
            touch "$STOP"
            stop_game
          }

          # Kills every descendant of a process, deepest first. A plain "pkill -P" misses the
          # sleeps inside the watchers, and those orphans keep the step's output open for minutes.
          kill_descendants() {
            local child
            for child in $(pgrep -P "$1" 2>/dev/null); do
              kill_descendants "$child"
              kill "$child" 2>/dev/null
            done
          }

          cleanup() {
            trap - EXIT
            touch "$STOP"
            stop_game
            kill_descendants $$
            ev "[shutdown] game and watchers stopped"
          }
          trap cleanup EXIT
          trap 'exit 130' INT TERM

          # ---------------- main loop ----------------

          ev "[supervisor] leg ${LEG}/${LEGS_TOTAL} online - stops in $(( (SWARM_DEADLINE - $(date +%s)) / 60 )) min"

          # Show the game's output, with its "localhost" address swapped for the public link.
          local_url="http://localhost:${PORT}"
          tail -n +1 -F "$GAME_LOG" | while IFS= read -r line; do
            case "$line" in *'HTTP/1.1"'*) continue ;; esac
            link="$(cat "$STATE/public_url" 2>/dev/null)"
            if [ -n "$link" ]; then
              line="${line//"$local_url"/$link}"
              line="${line//Play on this computer:/Play from anywhere:}"
              case "$line" in *"restart with --lan"*) line="  Phones and friends: just open the same link" ;; esac
            fi
            printf '%s\n' "$line"
          done &
          watch_repo &
          watch_health &
          watch_memory &
          heartbeat &
          deadline_timer &

          crashes=0
          backoff=2
          while [ ! -f "$STOP" ] && [ "$(date +%s)" -lt "$SWARM_DEADLINE" ]; do
            started=$(date +%s)
            start_game
            ev "[supervisor] neon_swarm.py running (pid ${GAME_PID})"
            wait "$GAME_PID"
            code=$?
            kill -KILL -- "-$GAME_PID" 2>/dev/null     # clear any leftover children
            [ -f "$STOP" ] && break
            if [ -f "$RESTART" ]; then
              ev "[supervisor] planned restart - starting the game again"
              backoff=2
              continue
            fi
            ran=$(( $(date +%s) - started ))
            [ "$ran" -gt 300 ] && backoff=2            # ran a while, so this was not a crash loop
            crashes=$((crashes + 1))
            ev "[supervisor] crash #${crashes}: exit code ${code} after ${ran}s - restarting in ${backoff}s"
            sleep "$backoff"
            backoff=$(( backoff * 2 > 60 ? 60 : backoff * 2 ))
          done
          ev "[supervisor] leg ${LEG}/${LEGS_TOTAL} finished with ${crashes} crash restart(s)"
          exit 0
          SUPERVISE_EOF

          chmod +x "$BIN/tunnel.sh" "$BIN/supervise.sh"
          bash -n "$BIN/tunnel.sh"
          bash -n "$BIN/supervise.sh"
          echo "Helper scripts written and syntax-checked in $BIN"

      - name: Start the virtual display and D-Bus session
        run: |
          set +e
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp -ac > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          eval "$(dbus-launch --sh-syntax)"
          {
            echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}"
            echo "DBUS_SESSION_BUS_PID=${DBUS_SESSION_BUS_PID}"
          } >> "$GITHUB_ENV"
          sleep 2
          exit 0

      - name: Start the public link (waking page first, tunnel second)
        env:
          LEG: ${{ matrix.leg }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_DOMAIN: ${{ vars.NGROK_DOMAIN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e
          STATE="$RUNNER_TEMP/neon"
          mkdir -p .neon-state

          # A waking page answers on the game port, so the link never goes dead during setup.
          python3 -m http.server "$PORT" --bind 127.0.0.1 --directory "$STATE/wake" > "$STATE/wake.log" 2>&1 &
          echo $! > "$STATE/wake.pid"

          # Install cloudflared (trycloudflare.com links, no account needed), with retries.
          for try in 1 2 3; do
            command -v cloudflared >/dev/null && break
            sudo curl -fsSL -o /usr/local/bin/cloudflared \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
              && sudo chmod +x /usr/local/bin/cloudflared && break
            echo "::warning::cloudflared download failed (try ${try})"
            sleep 5
          done
          command -v cloudflared >/dev/null && cloudflared --version

          # Optional: ngrok, only used when NGROK_AUTHTOKEN is set (gives a fixed link).
          if [ -n "$NGROK_AUTHTOKEN" ] && ! command -v ngrok >/dev/null; then
            curl -fsSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | sudo tar -xz -C /usr/local/bin
          fi

          nohup "$STATE/bin/tunnel.sh" "$STATE" "$PORT" > "$STATE/tunnel-supervisor.log" 2>&1 &
          echo $! > "$STATE/tunnel.pid"

          url=""
          for _ in $(seq 1 90); do
            if [ -s "$STATE/public_url" ]; then url="$(cat "$STATE/public_url")"; break; fi
            sleep 2
          done
          provider="$(cat "$STATE/public_provider" 2>/dev/null || echo unknown)"

          if [ -n "$url" ]; then
            echo "::notice title=Neon Swarm is live::$url"
            {
              echo "## Public link (leg ${LEG})"
              echo ""
              echo "**Play here:** $url"
              echo ""
              echo "_Provider: ${provider}. If this link ever changes, the log and your phone alert show the new one._"
              if [ "$provider" != "ngrok" ]; then
                echo "_Random link that changes each leg. Set NGROK_AUTHTOKEN and NGROK_DOMAIN for a fixed one._"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo "PUBLIC LINK ($provider): $url"
          else
            echo "::warning::No public link yet. The game still starts. Tunnel log follows."
            tail -n 30 "$STATE/tunnel.log" 2>/dev/null
          fi
          exit 0

      - name: Run the swarm (supervised, hot-reloading, watched)
        env:
          LEG: ${{ matrix.leg }}
          LEGS_TOTAL: ${{ needs.plan.outputs.legs }}
        run: bash "$RUNNER_TEMP/neon/bin/supervise.sh"

      - name: Stop the tunnel and waking page (frees the link for the next leg)
        if: ${{ always() }}
        run: |
          set +e
          STATE="$RUNNER_TEMP/neon"
          for f in tunnel.pid wake.pid; do
            if [ -s "$STATE/$f" ]; then kill "$(cat "$STATE/$f")" 2>/dev/null; fi
          done
          pkill -f 'neon/bin/tunnel.sh' 2>/dev/null
          pkill -x ngrok 2>/dev/null
          pkill -x cloudflared 2>/dev/null
          exit 0

      - name: Save leaderboard and state for the next leg
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            neon_swarm_scores.json
            .neon-state
          key: neon-swarm-state-${{ github.run_id }}-leg-${{ matrix.leg }}

      - name: Snapshot every repo file plus logs
        if: ${{ always() }}
        run: |
          set +e
          STATE="$RUNNER_TEMP/neon"
          STAGE="$RUNNER_TEMP/repo-snapshot"
          rm -rf "$STAGE" && mkdir -p "$STAGE/logs"
          rsync -a --exclude='.git/' --exclude='__pycache__/' --exclude='.venv/' --exclude='venv/' --exclude='node_modules/' ./ "$STAGE/"
          for f in events.log tunnel.log; do cp "$STATE/$f" "$STAGE/logs/" 2>/dev/null; done
          gzip -c "$STATE/game.log" > "$STAGE/logs/game.log.gz" 2>/dev/null
          cd "$STAGE" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          echo "Snapshot holds $(wc -l < SHA256SUMS.txt) files"

      - name: Upload the snapshot artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot-leg-${{ matrix.leg }}
          path: ${{ runner.temp }}/repo-snapshot
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: ignore

      - name: Leg report
        if: ${{ always() }}
        env:
          LEG: ${{ matrix.leg }}
          LEGS_TOTAL: ${{ needs.plan.outputs.legs }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e
          STATE="$RUNNER_TEMP/neon"
          count() {
            local n
            n="$(grep -c -- "$1" "$STATE/events.log" 2>/dev/null)"
            echo "${n:-0}"
          }
          crashes="$(count 'crash #')"
          {
            echo "## Leg ${LEG} of ${LEGS_TOTAL} finished"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Started | ${LEG_STARTED:-unknown} |"
            echo "| Public link | $(cat "$STATE/public_url" 2>/dev/null || echo none) |"
            echo "| Crash restarts | ${crashes} |"
            echo "| Hot reloads from pushes | $(count 'new commit') |"
            echo "| Health restarts | $(count 'no answer') |"
            echo "| Memory restarts | $(count 'game uses') |"
            echo ""
            echo "<details><summary>Last events</summary>"
            echo ""
            echo '```'
            tail -n 15 "$STATE/events.log" 2>/dev/null
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$crashes" -ge 20 ] && [ -n "$NTFY_TOPIC" ]; then
            curl -fsS -H "Title: Neon Swarm is crash-looping" -H "Priority: high" \
              -d "Leg ${LEG}: ${crashes} crash restarts. Check the run log." \
              "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
          fi
          exit 0

      # If setup failed, wait a bit so a broken leg cannot burn through the whole chain in minutes.
      - name: Cool down after a failed leg
        if: ${{ failure() }}
        run: |
          echo "::warning::This leg failed. Waiting 5 minutes before the next leg starts."
          sleep 300

      - name: Hand off to the next chain (last leg only, because GitHub ends runs at 35 days)
        if: ${{ !cancelled() && matrix.leg == fromJSON(needs.plan.outputs.legs) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - LEG_START ))
          if [ "$elapsed" -lt 3600 ]; then
            echo "::error::The last leg ran only $(( elapsed / 60 )) min, so the chain looks broken. Not handing off, to avoid a runaway loop."
            exit 0
          fi
          echo "::notice::Last leg reached - queuing the next chain"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=neon-swarm-handoff
