name: Neon Swarm AI Game Upgrader

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "What should the AI improve or add to Neon Swarm?"
        required: true
        type: string
        default: "Add 1-3 substantial gameplay features to Neon Swarm. Keep every existing mechanic and screen intact; additions only."
      model:
        description: "OpenRouter model ID (provider/model)"
        required: false
        type: string
        default: "openai/gpt-oss-120b"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: neon-swarm-ai-upgrader-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upgrade-game:
    name: Generate, validate and publish Neon Swarm upgrades
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Python and Node package downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ runner.os }}-deps-py3.12-node22-${{ hashFiles('requirements.txt', 'pyproject.toml', 'package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-py3.12-node22-

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install ruff coverage bandit

      - name: Generate upgrades with ordered AI fallback
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_SECRET }}
          OPENROUTER_MODEL: ${{ inputs.model || 'openai/gpt-oss-120b' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          UPGRADE_GOAL: ${{ inputs.goal }}
        run: python .github/scripts/ai_game_upgrader.py

      - name: Validate generated game changes
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q auth.py neon_swarm.py test_auth.py
          ruff check --select E4,E7,E9,F auth.py neon_swarm.py test_auth.py
          coverage run --branch -m unittest discover -v
          coverage report --show-missing
          bandit -q -r auth.py neon_swarm.py --severity-level medium --confidence-level medium
          for file in neon_swarm_*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
          bash -n supervise.sh tunnel.sh

      - name: Create upgrade branch and pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add -- "Neon Swarm.html"
          for file in neon_swarm_*.js; do
            [ -f "$file" ] || continue
            git add -- "$file"
          done

          if git diff --cached --quiet; then
            echo "No staged game changes to publish."
            exit 0
          fi

          BRANCH="ai/neon-swarm-upgrade-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "feat: AI-generated Neon Swarm gameplay improvements"
          git push --set-upstream origin "$BRANCH"
          echo "Pushed upgrade branch: $BRANCH"
          echo "PR URL: https://github.com/${GITHUB_REPOSITORY}/pull/new/${BRANCH}"

          if ! gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "feat: AI-generated Neon Swarm gameplay improvements" \
            --body-file ai-upgrade-summary.md; then
            echo "::warning::Branch pushed, but automatic PR creation was unavailable."
            echo "Open the PR using the URL above."
          fi

      - name: Upload upgrade summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-swarm-ai-upgrade-summary
          path: ai-upgrade-summary.md
          if-no-files-found: ignore
          retention-days: 30
