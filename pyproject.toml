[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neon-swarm"
version = "1.0.0"
description = "Neon Swarm arcade survival game and local Python server"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
dependencies = [
    "cryptography>=41.0.7",
]

[tool.setuptools]
py-modules = ["neon_swarm", "auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
